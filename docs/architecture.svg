<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="agentCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#170936" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)" />

  <!-- Subtle Grid Dots -->
  <g opacity="0.10">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" />
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)" />
  </g>

  <!-- Title Header (Minimalist & Clean) -->
  <g transform="translate(60, 45)">
    <text x="0" y="24" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">Incident Notifier</text>
    <text x="0" y="44" fill="#94a3b8" font-size="13">High-Level Architecture &amp; System Flow</text>

    <!-- Tech Badges -->
    <g transform="translate(740, 10)">
      <rect x="0" y="0" width="55" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="27" y="16" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Bun</text>

      <rect x="65" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="107" y="16" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

      <rect x="160" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="202" y="16" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">LangGraph</text>

      <rect x="255" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="295" y="16" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Gemini Pro</text>
    </g>
  </g>

  <!-- ==================== MAIN PIPELINE CARDS ==================== -->

  <!-- CARD 1: Microservices -->
  <g transform="translate(60, 180)" filter="url(#shadow)">
    <rect width="165" height="210" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="82" cy="55" r="24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <text x="82" y="62" font-size="22" text-anchor="middle">🖥️</text>

    <text x="82" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Microservices</text>
    <text x="82" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">Payment • DB • Cache</text>

    <rect x="18" y="145" width="129" height="36" rx="6" fill="#0f172a" />
    <text x="82" y="167" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">Structured JSON</text>
  </g>

  <!-- Arrow 1: Streaming Logs -->
  <path d="M 225 285 L 285 285" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="222" y="248" width="88" height="20" rx="10" fill="#0c4a6e" />
  <text x="266" y="261" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">Streaming Logs</text>

  <!-- CARD 2: Grafana Loki -->
  <g transform="translate(290, 180)" filter="url(#shadow)">
    <rect width="165" height="210" rx="14" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="82" cy="55" r="24" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5" />
    <text x="82" y="62" font-size="22" text-anchor="middle">🪵</text>

    <text x="82" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Grafana Loki</text>
    <text x="82" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">Log Aggregator</text>

    <rect x="18" y="145" width="129" height="36" rx="6" fill="#0f172a" />
    <text x="82" y="167" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">LogQL Stream API</text>
  </g>

  <!-- Arrow 2: Poll 10m Window -->
  <path d="M 455 285 L 515 285" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="448" y="248" width="94" height="20" rx="10" fill="#451a03" />
  <text x="495" y="261" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">Poll Errors (10m)</text>

  <!-- CARD 3: Vercel Cron & Deduplication -->
  <g transform="translate(520, 180)" filter="url(#shadow)">
    <rect width="185" height="210" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="92" cy="55" r="24" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" />
    <text x="92" y="62" font-size="22" text-anchor="middle">⚡</text>

    <text x="92" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Vercel Cron</text>
    <text x="92" y="125" fill="#fbbf24" font-size="11" text-anchor="middle">Serverless /api/cron</text>

    <rect x="16" y="145" width="153" height="42" rx="6" fill="#0f172a" />
    <text x="92" y="163" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Error Deduplication</text>
    <text x="92" y="177" fill="#94a3b8" font-size="8" text-anchor="middle">Suppresses Alert Storms</text>
  </g>

  <!-- Arrow 3: Novel Error -->
  <path d="M 705 285 L 765 285" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <rect x="702" y="248" width="86" height="20" rx="10" fill="#3b0764" />
  <text x="745" y="261" fill="#d8b4fe" font-size="9" font-weight="700" text-anchor="middle">Novel Error</text>

  <!-- CARD 4: LangGraph SRE Agent (Gemini Core) -->
  <g transform="translate(770, 180)" filter="url(#shadow)">
    <rect width="185" height="210" rx="14" fill="url(#agentCardBg)" stroke="#c084fc" stroke-width="2" />
    <circle cx="92" cy="55" r="24" fill="#581c87" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)" />
    <text x="92" y="62" font-size="22" text-anchor="middle">🤖</text>

    <text x="92" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">AI SRE Agent</text>
    <text x="92" y="125" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">LangGraph.js + Gemini</text>

    <rect x="16" y="145" width="153" height="42" rx="6" fill="#170936" />
    <text x="92" y="163" fill="#e9d5ff" font-size="10" font-weight="600" text-anchor="middle">Root-Cause Analysis</text>
    <text x="92" y="177" fill="#a7f3d0" font-size="8" text-anchor="middle">Separates Facts vs Hypotheses</text>
  </g>

  <!-- Bidirectional Connection to Qdrant (Downwards) -->
  <path d="M 862 390 L 862 445" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <path d="M 872 445 L 872 390" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3" />

  <!-- CARD 5: Qdrant Vector DB (RAG) Below Agent -->
  <g transform="translate(770, 450)" filter="url(#shadow)">
    <rect width="185" height="95" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="47" r="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <text x="36" y="53" font-size="16" text-anchor="middle">📚</text>

    <text x="66" y="42" fill="#34d399" font-size="13" font-weight="700">Qdrant RAG</text>
    <text x="66" y="60" fill="#94a3b8" font-size="10">SRE Runbooks &amp; Specs</text>
    <text x="66" y="74" fill="#6ee7b7" font-size="8">129 Chunks (ingest-docs)</text>
  </g>

  <!-- Arrow 4: Incident Report -->
  <path d="M 955 285 L 1015 285" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <rect x="948" y="248" width="94" height="20" rx="10" fill="#581c87" />
  <text x="995" y="261" fill="#f3e8ff" font-size="9" font-weight="700" text-anchor="middle">Incident Alert</text>

  <!-- CARD 6: Telegram Notification -->
  <g transform="translate(1020, 180)" filter="url(#shadow)">
    <rect width="145" height="210" rx="14" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.8" />
    <circle cx="72" cy="55" r="24" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5" />
    <text x="72" y="62" font-size="22" text-anchor="middle">📱</text>

    <text x="72" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Telegram</text>
    <text x="72" y="125" fill="#38bdf8" font-size="11" text-anchor="middle">@myNoto304Bot</text>

    <rect x="14" y="145" width="117" height="42" rx="6" fill="#0f172a" />
    <text x="72" y="163" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">On-Call Engineers</text>
    <text x="72" y="177" fill="#34d399" font-size="8" text-anchor="middle">&lt; 8s Total Triage</text>
  </g>

</svg>

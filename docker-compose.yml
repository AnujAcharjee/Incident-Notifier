services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: incident-notifier-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: incident-notifier-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

volumes:
  qdrant_data:
